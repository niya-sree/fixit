apiVersion: apps/v1
kind: Deployment
metadata: 
  name: fixit
spec:
  replicas: 2
  
  selector:
    matchLabels:
      app: fixit
  template:
    metadata:
      labels:
        app: fixit
    spec:
      containers:
        - name: fixit
          image: fixit:v2
          ports:
            - containerPort: 3000
          
          envFrom:
            - configMapRef:
                name: fixit-config
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
