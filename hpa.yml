apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fixit-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fixit

  minReplicas: 2
  maxReplicas: 5

  metrics: 
    - type: Resource
      resource: 
        name: cpu
        target: 
          type: Utilization
          averageUtilization: 50

    - type: Resource
      resource:
        name: Memory
        target:
          type: Utilization
          averageUtilization: 70

