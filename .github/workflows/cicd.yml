name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run : npm ci

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run : docker build -t ${{ secrets.DOCKER_USERNAME }}/fixit:v1 .

      - name: Log In Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          Password: ${{ secrets.DOCKER_TOKEN_KEY }}

      - name: Push Docker Image
        run : docker push ${{ secrets.DOCKER_USERNAME }}/fixit:v1
